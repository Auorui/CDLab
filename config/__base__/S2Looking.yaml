data:
  dataset_path: 'data/S2Looking'
  target_shape: 256
  num_classes: 2
  dir_n1: 'Image1'
  dir_n2: 'Image2'
  dir_label: 'label'
  label_threshold: 127
  ignore_index: 256
  val_mode: 'resize_pad'  # center_crop or resize_pad
  color_map: {
    '0': [0, 0, 0],  # label 0   (rgb)
    '1': [ 255, 255, 255 ],  # label 1   (rgb)
  }