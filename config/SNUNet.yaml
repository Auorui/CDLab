# config/SNUNet.yaml
data_config: '__base__/CLCD.yaml'

model:
  name: 'SNUNet'
  params:
    in_ch: 3
    num_classes: 2

optimizer_type: 'adamw'
lr: 0.0001
momentum: 0.9
weight_decay: 0.0001
scheduler_type: 'gradual_warm'
warmup_epochs: 5

loss_type: ['dice', 'focal']
loss_weight: [0.5, 0.5]
aux_loss_weights: null

epochs: 200
batch_size: 8

log_dir: './logs'
monitor_metric: "F1"      # 监控并保存最优模型的指标 (可选: IoU, F1, OA, P, R)
save_period: 50
resume: null      # 这里是完整的模型检查点路径（包含记忆项）